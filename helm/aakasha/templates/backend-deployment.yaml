apiVersion: apps/v1
kind: Deployment
metadata:
  name: aakasha-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: aakasha-backend

  template:
    metadata:
      labels:
        app: aakasha-backend

    spec:
      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: 3005

          env:
            - name: DB_HOST
              value: aakasha-mysql

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: {{ .Values.mysql.database | quote }}

            - name: DB_USER
              value: {{ .Values.mysql.username | quote }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aakasha-mysql-secret
                  key: mysql-password

          readinessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 20
