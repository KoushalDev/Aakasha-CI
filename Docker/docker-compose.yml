version: '3.8'

services:
  mysql:
    build: /db
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pbooth
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: /backend/
    container_name: aakasha-backend
    restart: always
    env_file:
      - /backend/.env
    ports:
      - "4000:4000"
    depends_on:
      - mysql

  frontend:
    build: /frontend/
    container_name: aakasha-frontend
    restart: always
	env_file:
      - /frontend/Aakasha_ui/.env
    ports:
      - "3000:3000"

volumes:
  mysql_data: 
